# Collections ("cookbooks") — static saved views over your recipe library.
#
# Each entry becomes a page at /collections/<slug>/. A recipe appears in a
# collection when it matches ANY of the tags, or (when given) the category.
# `slug` is generated from `name` when omitted.
#
# Examples:
#
# collections:
#   - name: Weeknight dinners
#     description: Fast, reliable mains
#     tags: [dinner, quick]
#   - name: Christmas baking
#     category: dessert
#     tags: [christmas]
collections:
  - name: Quick wins
    description: Recipes tagged "quick" — delete or edit this example in collections.yml
    tags: [quick]
